networks:
  proxy-net:
    external: false

services:
  db:
    image: postgres:15-alpine
    command: postgres -c max_connections=200
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgre}
      POSTGRES_DB: ${DB_DATABASE:-harumnya}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proxy-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-harumnya}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    networks:
      - proxy-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/itheavenscent/pos-harumnya:latest
    container_name: laravel_app
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env # .env dari host, bukan dari image
      - ./storage:/var/www/storage # persist upload & log
      - ./bootstrap/cache:/var/www/bootstrap/cache # persist cache
      - public_data:/var/www/public-shared # asset publik (Vite build) untuk nginx
      # Mount folder untuk development lokal agar perubahan code langsung terbaca tanpa build ulang
      - ./app:/var/www/app
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./config:/var/www/config
    networks:
      - proxy-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "php", "-r", "$$c = @fsockopen('127.0.0.1', 9000); if ($$c) { fclose($$c); exit(0); } exit(1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/public # allow Docker to create mountpoint for storage
      - ./storage/app/public:/var/www/public/storage:ro # Direct mount for uploads
      - html:/usr/share/nginx/html # ACME challenge token
      - ./logs/nginx:/var/log/nginx
    expose:
      - "80"
    environment:
      VIRTUAL_HOST: harumnya.cloud
      LETSENCRYPT_HOST: harumnya.cloud
      VIRTUAL_PORT: 80
    networks:
      - proxy-net
    depends_on:
      app:
        condition: service_healthy
      nginx-proxy:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - dhparam:/etc/nginx/dhparam
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./logs/nginx-proxy:/var/log/nginx
      - ./docker/nginx-proxy/custom_proxy.conf:/etc/nginx/conf.d/custom_proxy.conf:ro
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    restart: always
    environment:
      DEFAULT_EMAIL: andykasalom@gmail.com
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    networks:
      - proxy-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-backup:
    image: prodrigestivill/postgres-backup-local:15
    container_name: db-backup
    restart: always
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${DB_DATABASE:-harumnya}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgre}
      - SCHEDULE=0 2 * * *
      - BACKUP_KEEP_DAYS=7
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - proxy-net

volumes:
  pgdata:
  redisdata:
  public_data:
  conf:
  vhost:
  html:
  dhparam:
  certs:
  acme:

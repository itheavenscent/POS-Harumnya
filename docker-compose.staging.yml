# ─────────────────────────────────────────────────────────────────────────────
# STAGING stack — jalan di VPS yang SAMA dgn production, tapi terisolasi:
#   • project name terpisah  : `-p pos-staging`  (volume otomatis ter-prefix)
#   • service name unik       : staging-*  (hindari bentrok alias DNS di network
#                                            bersama dgn container production)
#   • DB / redis / assets      : volume sendiri (tidak menyentuh data production)
#   • domain                   : staging.harumnya.cloud
#
# nginx-proxy + acme-companion TIDAK didefinisikan di sini — keduanya dipakai
# bersama dari stack production (routing by VIRTUAL_HOST, cert by LETSENCRYPT_HOST).
# Staging cukup ikut network production yg sudah ada (external), nama network
# di-inject lewat env PROXY_NETWORK (dideteksi otomatis oleh workflow).
# ─────────────────────────────────────────────────────────────────────────────

networks:
  proxy-net:
    external: true
    name: ${PROXY_NETWORK:-pos-harumnya_proxy-net}

services:
  staging-db:
    image: postgres:15-alpine
    command: postgres -c max_connections=100
    restart: always
    # TIDAK expose port ke host — 5432 host sudah dipakai production.
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-harumnya_staging}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - proxy-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-harumnya_staging}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  staging-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    networks:
      - proxy-net
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  staging-app:
    # Image hasil build workflow (di-retag lokal ke :staging-latest saat deploy).
    image: ${STAGING_IMAGE:-ghcr.io/itheavenscent/pos-harumnya:staging-latest}
    restart: unless-stopped
    volumes:
      - ./.env:/var/www/.env
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
      - public_data:/var/www/public-shared
      # Kode PHP dibaca dari host (git checkout SHA yg ditest) — sama pola dgn prod.
      - ./app:/var/www/app
      - ./routes:/var/www/routes
      - ./resources:/var/www/resources
      - ./config:/var/www/config
    networks:
      - proxy-net
    depends_on:
      staging-db:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$c = @fsockopen('127.0.0.1', 9000); if ($$c) { fclose($$c); exit(0); } exit(1);"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  staging-nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - public_data:/var/www/public
      - ./storage/app/public:/var/www/public/storage:ro
      - ./logs/nginx:/var/log/nginx
    expose:
      - "80"
    environment:
      # nginx-proxy production akan route domain ini ke container staging.
      VIRTUAL_HOST: ${STAGING_DOMAIN:-staging.harumnya.cloud}
      LETSENCRYPT_HOST: ${STAGING_DOMAIN:-staging.harumnya.cloud}
      VIRTUAL_PORT: 80
    networks:
      - proxy-net
    depends_on:
      staging-app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
  public_data:

name: Deploy to Staging

# Setiap push ke main: build image SEKALI (tag = git SHA), lalu auto-deploy ke
# STAGING. Production TIDAK ikut ke-update di sini — promote manual lewat
# workflow "Deploy to Production" memakai image SHA yang sama.

on:
  push:
    branches: [main]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/itheavenscent/pos-harumnya

jobs:
  build-and-deploy-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image (tag = SHA + staging-latest)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:staging-latest
          # Nonaktifkan provenance/SBOM — bikin image multi-manifest yg kadang
          # ditolak ghcr.io ("unknown blob").
          provenance: false
          sbom: false

      - name: Deploy to Staging via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GIT_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GIT_SHA,GHCR_TOKEN,GHCR_ACTOR
          script: |
            set -e
            IMAGE="ghcr.io/itheavenscent/pos-harumnya"

            cd /var/www/POS-Harumnya-staging

            # Checkout commit yang persis dibangun (kode PHP dibaca dari host).
            git fetch origin
            git checkout -f "$GIT_SHA"

            # Login GHCR & pull image SHA ini.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            docker pull "$IMAGE:$GIT_SHA"
            docker tag  "$IMAGE:$GIT_SHA" "$IMAGE:staging-latest"

            # Deteksi network yang dipakai nginx-proxy production (biar routing jalan).
            export PROXY_NETWORK=$(docker inspect nginx-proxy \
              -f '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}' \
              | awk '{print $1}')
            echo "Proxy network: ${PROXY_NETWORK:-<not found>}"
            if [ -z "$PROXY_NETWORK" ]; then
              echo "ERROR: container nginx-proxy tidak ditemukan / tidak jalan."
              exit 1
            fi

            # Ekstrak static assets (Vite build) dari image ke host untuk nginx.
            docker run --rm --user root -v $(pwd)/public:/host-public "$IMAGE:$GIT_SHA" \
              sh -c "rm -rf /host-public/build && cp -r /var/www/public/build /host-public/ && chmod -R 755 /host-public/build"

            # Direktori runtime.
            mkdir -p logs/nginx storage bootstrap/cache \
                     storage/app/public storage/framework/cache/data \
                     storage/framework/sessions storage/framework/views storage/logs

            if [ ! -f .env ]; then
              echo "ERROR: .env staging tidak ada di /var/www/POS-Harumnya-staging" && exit 1
            fi

            # Naikkan stack staging (project terpisah).
            docker compose -p pos-staging -f docker-compose.staging.yml up -d --remove-orphans

            echo "Menunggu database staging..."
            sleep 15

            # key:generate hanya jika APP_KEY belum diisi.
            if ! grep -q "^APP_KEY=base64:" .env; then
              docker compose -p pos-staging -f docker-compose.staging.yml exec -T --user root staging-app php artisan key:generate --force
              docker compose -p pos-staging -f docker-compose.staging.yml exec -T --user root staging-app chown www-data:www-data /var/www/.env
            fi

            docker compose -p pos-staging -f docker-compose.staging.yml exec -T --user root staging-app \
              chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache
            docker compose -p pos-staging -f docker-compose.staging.yml exec -T --user root staging-app \
              chmod -R 775 /var/www/storage /var/www/bootstrap/cache

            docker compose -p pos-staging -f docker-compose.staging.yml exec -T staging-app php artisan migrate --force
            docker compose -p pos-staging -f docker-compose.staging.yml exec -T staging-app php artisan storage:link --force
            docker compose -p pos-staging -f docker-compose.staging.yml exec -T staging-app php artisan optimize:clear
            docker compose -p pos-staging -f docker-compose.staging.yml exec -T staging-app php artisan optimize

            # Restart paksa staging-app agar OPcache (validate_timestamps=0) tidak
            # menyajikan bytecode basi dari sebelum route:cache di-refresh di atas —
            # kode/route di-mount dari host, jadi container kadang tidak otomatis
            # di-recreate meski route/app/resources/config berubah.
            docker compose -p pos-staging -f docker-compose.staging.yml restart staging-app

            echo "Staging deploy selesai untuk commit $GIT_SHA"
            docker compose -p pos-staging -f docker-compose.staging.yml ps

      - name: Ringkasan promote
        run: |
          echo "### ✅ Staging ter-deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://staging.harumnya.cloud" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Setelah testing, promote ke production dgn SHA ini:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Actions → **Deploy to Production** → Run workflow → paste SHA di atas." >> "$GITHUB_STEP_SUMMARY"
